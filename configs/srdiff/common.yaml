engine: SRDiffEngine

experiment:
  name: srdiff
  root_dir: work_dirs
  # The paper does not report a seed; 42 is this release's deterministic default.
  seed: 42

dataset:
  name: sevir_sequence
  img_height: 128
  img_width: 128
  data_types: [ir069, ir107, lght, vil]
  first_train_date: [2018, 1, 1]
  train_test_split_date: [2019, 6, 1]

  train_dataset:
    data_types: [ir069, ir107, lght, vil]
    seq_len: &seq_len 25
    stride: &stride 12
    layout: &layout NTHW
    rescale_method: &rescale_method ddim
    downsample_dict: &downsample_dict
      vil: [2, 3, 3]
      lght: [2, 1, 1]
      ir069: [2, 1, 1]
      ir107: [2, 1, 1]

  test_dataset:
    data_types: [ir069, ir107, lght, vil]
    seq_len: *seq_len
    stride: *stride
    layout: *layout
    rescale_method: *rescale_method
    downsample_dict: *downsample_dict

  metrics:
    metrics_mode: "0"
    metrics_list: [csi, pod, sucr, bias, hss]
    threshold_list: [16, 74, 133, 160, 181, 219]

dataloader:
  # Paper setting: 8 samples/GPU x 4 GPUs = global batch size 32.
  train_batch_size_per_gpu: 8
  test_batch_size_per_gpu: 4
  num_workers: 8

logging:
  tensorboard:
    name: srdiff

model:
  vae:
    scaling_factor: 0.18215
    from_pretrained: work_dirs/checkpoints/vae/vae_framewise_lr.pth
    model_cfg:
      in_channels: 1
      out_channels: 1
      latent_channels: 4
      layers_per_block: 2
      block_out_channels: [128, 256, 512]
      down_block_types: [DownEncoderBlock2D, DownEncoderBlock2D, DownEncoderBlock2D]
      up_block_types: [UpDecoderBlock2D, UpDecoderBlock2D, UpDecoderBlock2D]
      norm_num_groups: 32
      act_fn: silu

  dit:
    model_cfg:
      input_size: 32
      patch_size: 2
      in_channels: 8
      hidden_size: 1152
      enc_hidden_size: 256
      num_frames: 7
      enc_depth: &num_layers 12
      latent_depth: *num_layers
      num_heads: 16
      mlp_ratio: 4.0
      out_channels: 28
      single_heads_num: 4

  adapter:
    in_channels: 3
    mid_channels: 64
    out_channels: 4
    num_residual_blocks: 2
    num_heads: 4

  cmca:
    mid_channels: 64
    out_channels: 4
    num_residual_blocks: 2
    num_mtai_blocks: 2
    num_heads: 4
    patch_size: 2
    drop_rate: 0.0

pipeline:
  meta:
    max_epochs: 350
    max_iters: &max_iters 200000
    check_val_every_n_epoch: 5
    precision: bf16-mixed

  rectified_flow:
    num_train_timesteps: 1000
    num_inference_steps: 10
    ensemble_times: 1
    reduction: median

  optimizer:
    kwargs:
      lr: 5.0e-5
      weight_decay: 0.01
      betas: [0.9, 0.95]

  lr_scheduler:
    kwargs:
      total_iters: *max_iters
      final_ratio: 0.02
      warmup_steps: 1000
